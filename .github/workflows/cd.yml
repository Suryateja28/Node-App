name: deploy to ec2
on:
  workflow run:
    workflows: ["CI"]
    branches: [ "main" ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: deploy to ec2
        uses: easingthemes/ssh-deploy@v2.1.5
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}
          remote-user: ubuntu
          server-ip: ${{ secrets.EC2_PUBLIC_IP }}
          remote-path: /home/ubuntu/node-app
            docker pull suryateja28/node-app:latest
            docker stop node-app || true
            docker rm node-app || true
            docker run -d --name node-app -p 80:3000 suryateja28/node-app:latest  
          local-path: .
          pre-deploy: |
            docker pull suryateja28/node-app:latest
            docker stop node-app || true
            docker rm node-app || true
          deploy: |
            docker run -d --name node-app -p 80:3000 suryateja28/node-app:latest
